<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deno Mock Server</title>
    <link rel="icon" type="image/svg+xml" href="/ui/favicon.svg">
    <link rel="alternate icon" href="/ui/favicon.ico">
    <link rel="stylesheet" href="/ui/styles.css">
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Deno Mock Server</h1>
        <nav>
          <button id="mocks-nav-btn" class="nav-btn active">Mocks</button>
          <button id="livefeed-nav-btn" class="nav-btn">Live Feed</button>
        </nav>
        <button id="new-mock-btn">New Mock</button>
      </header>

      <main>
        <section id="mock-list-section">
          <h2>Mocks</h2>
          <div id="mock-list">Loading...</div>
        </section>

        <section id="livefeed-section" style="display: none;">
          <h2>Live Feed</h2>
          <button id="clear-livefeed-btn">Clear</button>
          <div id="livefeed-list"></div>
        </section>

        <section id="editor-section" style="display: none;">
          <h2 id="editor-title">New Mock</h2>
          <form id="mock-form">
            <input type="hidden" id="mock-id">
            <div class="field">
              <label>Name</label>
              <input type="text" id="mock-name" required placeholder="My API Mock">
            </div>
            <div class="field">
              <label>Method</label>
              <select id="mock-method">
                <option value="GET">GET</option>
                <option value="POST">POST</option>
                <option value="PUT">PUT</option>
                <option value="DELETE">DELETE</option>
                <option value="PATCH">PATCH</option>
                <option value="*">ANY (*)</option>
              </select>
            </div>
            <div class="field">
              <label>Path Pattern</label>
              <input type="text" id="mock-path" required placeholder="/api/users/:id">
            </div>
            <div class="field">
              <label>Priority</label>
              <input type="number" id="mock-priority" value="0">
            </div>
            <div class="field">
              <label>Type</label>
              <select id="mock-type">
                <option value="static">Static</option>
                <option value="conditional">Conditional</option>
                <option value="sequence">Sequence</option>
                <option value="script">Script</option>
                <option value="rest">REST API</option>
              </select>
            </div>

            <div id="config-static" class="config-fields">
              <h3>Static Response</h3>
              <div class="field">
                <label>Status</label>
                <input type="number" id="static-status" value="200">
              </div>
              <div class="field">
                <label>Content-Type</label>
                <input type="text" id="static-content-type" list="content-types" placeholder="text/plain">
              </div>
              <div class="field">
                <label>Body (JSON string)</label>
                <textarea id="static-body"></textarea>
              </div>
            </div>

            <div id="config-conditional" class="config-fields" style="display: none;">
              <h3>Conditions</h3>
              <div id="conditions-list"></div>
              <button type="button" id="add-condition-btn" style="margin-bottom: 1rem;">Add Condition</button>

              <div class="field">
                <label>Else Status</label>
                <input type="number" id="else-status" value="404">
              </div>
              <div class="field">
                <label>Else Content-Type</label>
                <input type="text" id="else-content-type" list="content-types" placeholder="text/plain">
              </div>
            </div>

            <div id="config-sequence" class="config-fields" style="display: none;">
              <h3>Sequence Config (JSON List)</h3>
              <textarea id="sequence-config"
                placeholder='[{"status":200,"body":"step 1"},{"status":200,"body":"step 2"}]'></textarea>
              <label><input type="checkbox" id="sequence-cycle" checked> Cycle at end</label>
            </div>

            <div id="config-script" class="config-fields" style="display: none;">
              <h3>Script (JS/TS)</h3>
              <textarea id="script-code" placeholder="// Available context: method, path, pathParams, query, headers, body
return { status: 200, body: JSON.stringify({ id: context.pathParams.id }) };"></textarea>
            </div>

            <div id="config-rest" class="config-fields" style="display: none;">
              <h3>REST API Config</h3>
              <div class="field">
                <label>ID Field Name</label>
                <input type="text" id="rest-id-field" value="id" placeholder="id">
              </div>
              <div class="field">
                <label>Initial State (JSON Array)</label>
                <textarea id="rest-initial-state" placeholder='[{"id": 1, "name": "Item 1"}]'></textarea>
              </div>
            </div>

            <div class="actions">
              <button type="submit">Save</button>
              <button type="button" id="cancel-btn">Cancel</button>
            </div>
          </form>
        </section>
      </main>
    </div>
    <datalist id="content-types">
      <option value="text/plain"></option>
      <option value="application/json"></option>
      <option value="text/html"></option>
      <option value="application/xml"></option>
      <option value="text/css"></option>
      <option value="application/javascript"></option>
    </datalist>
    <script src="/ui/app.js"></script>
  </body>
</html>
